/* Arrows and phonetic symbols (/ɪ/, /ŋ/, /ʃ/, ˈ stress marks) the embedded fonts lack come from the computer's
   own regular face, so the browser never reaches for Segoe UI Semibold to draw them at weight 500. */
@font-face{font-family:'Glyphs';font-style:normal;font-weight:400 500;font-display:swap;src:local('Segoe UI'),local('SegoeUI'),local('Roboto'),local('Arial');unicode-range:U+0100-024F,U+0250-02FF,U+0300-036F,U+1D00-1D7F,U+2190-21FF}
</style><style>/* The parents' results page, v2: one task per screen on a phone. MOE navy/teal on pale blue, Tajawal (≤500),
   body 19px (≈14pt), nothing under 18px (13.5pt). One authored motion (the ten answers filling in), none under
   reduced motion, no blinking. Print: black on white, hairline borders, the step page replaced by the report. */
:root {
  --bg: #EBF3FD; --paper: #FFFFFF; --soft: #F4F8FD; --line: #D3E0F0; --line2: #B9CCE3;
  --ink: #033E72; --deep: #051E65; --mute: #48627F; --teal: #06A17D; --teal2: #0A7A6C; --tealT: #DCF3EC;
  --bad: #B03A2E; --badT: #FBE9E6; --gold: #8A5A00; --goldT: #FBF1DA; --goldL: #E7C98A;
  --ar: 'Tajawal', 'Segoe UI', sans-serif; --en: 'Baloo Bhaijaan 2', 'Tajawal', 'Segoe UI', sans-serif;
  --r: 14px; --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* .ask and friends set display: grid, which would beat the attribute */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 19px/1.75 var(--ar); }
.en, [dir=ltr] { font-family: var(--en); }
.nw { white-space: nowrap; }
h1, h2, h3 { font-weight: 500; margin: 0; line-height: 1.35; text-wrap: balance; }
b { font-weight: 500; } /* the fonts stop at 500: no synthetic bold */
b.em { color: var(--deep); }
b.gl { color: var(--mute); }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
span.blank { display: inline-block; width: 3.2em; border-bottom: 2px solid currentColor; margin: 0 .25em; vertical-align: -0.1em; opacity: .6; }

/* header */
.top { display: flex; align-items: center; gap: 14px; background: var(--paper); padding: 12px 16px; border-bottom: 1px solid var(--line); }
.top img { width: 64px; height: auto; }
.top h1 { font-size: 22px; color: var(--deep); }
.top-t p { font-size: 18px; color: var(--mute); line-height: 1.5; }
.top-t b { color: var(--ink); font-weight: 500; }
main { max-width: 720px; margin: 0 auto; padding: 18px 16px 48px; }

/* lookup */
.ask { display: grid; gap: 22px; }
.ask h2 { font-size: 26px; color: var(--deep); }
.how { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.how li { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; }
.how-n { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--line2); color: var(--teal2); font: 500 20px/1 var(--en); }
.how b { font-weight: 500; color: var(--deep); }
.how p { color: var(--mute); font-size: 18px; line-height: 1.6; }
form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; box-shadow: 0 6px 18px -12px rgba(5, 30, 101, .35); }
label { font-weight: 500; color: var(--deep); }
#nid { font: 500 26px/1.3 var(--en); letter-spacing: .12em; text-align: center; direction: ltr; padding: 12px; width: 100%; border: 2px solid var(--line2); border-radius: 12px; color: var(--deep); background: var(--soft); }
#nid:focus { outline: none; border-color: var(--teal); background: var(--paper); }
.msg { color: var(--bad); min-height: 1.75em; }
.note { color: var(--mute); font-size: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 20px; border-radius: 12px; border: 2px solid transparent; font-weight: 500; cursor: pointer; transition: background-color .2s, border-color .2s, transform .15s var(--ease); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--teal2); color: #fff; }
.btn.primary:hover { background: #086A5E; }
.btn.ghost { background: var(--paper); border-color: var(--line2); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink); }
.linkb { background: none; border: 0; padding: 4px 0; color: var(--teal2); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; text-align: start; }

/* report: who + progress */
#report { display: grid; gap: 16px; }
.who { padding-bottom: 12px; border-bottom: 1px solid var(--line2); }
.who-n { font-size: 26px; color: var(--deep); }
.who p { color: var(--mute); font-size: 18px; line-height: 1.6; }
.prog { display: grid; gap: 6px; }
.prog-t { font-size: 18px; color: var(--mute); }
.prog-t b { color: var(--deep); font-weight: 500; }
.prog ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
.prog li { flex: 1; }
.seg { display: block; width: 100%; height: 22px; padding: 7px 0; background: none; border: 0; cursor: pointer; }
.seg::before { content: ''; display: block; height: 8px; border-radius: 4px; background: var(--line2); transition: background-color .3s; }
.seg.done::before { background: var(--teal); }
.seg.now::before { background: var(--deep); }

/* a step */
.view { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; box-shadow: 0 8px 24px -18px rgba(5, 30, 101, .45); }
.step { display: grid; gap: 16px; }
.step > h2 { font-size: 24px; color: var(--deep); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.step > h2:focus { outline: none; }
.band { color: var(--mute); }
.big { font: 500 46px/1 var(--en); color: var(--teal2); }
.result > h2 { align-items: baseline; }

/* the ten answers */
.chips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chip { min-width: 0; }
.chip > button, .chip:not(:has(button)) { width: 100%; display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--paper); font-size: 18px; line-height: 1.3; }
.chip > button { cursor: pointer; }
.chip.ok > *, .chip.ok:not(:has(button)) { background: var(--tealT); border-color: #9FD8C6; color: var(--teal2); }
.chip.bad > button { background: var(--badT); border-color: #EBB9B1; color: var(--bad); }
.chip.blank > button { background: var(--soft); border-style: dashed; color: var(--mute); }
.chip > button:hover { border-color: currentColor; }
.c-n { font: 500 20px/1 var(--en); }
.c-w { font-size: 18px; white-space: nowrap; }
@media (max-width: 400px) { .c-w { display: none; } .chip .ic { width: 1.4em; height: 1.4em; } }
@media (prefers-reduced-motion: no-preference) {
  .chips .chip { animation: fill .5s var(--ease) both; animation-delay: calc(var(--i) * 60ms); }
  @keyframes fill { from { transform: translateY(8px) scale(.94); } }
}
.promise { background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.saved { color: var(--teal2); }
.beh { display: flex; gap: 10px; align-items: flex-start; background: var(--goldT); border: 1px solid var(--goldL); color: #5E3D00; border-radius: 12px; padding: 12px 14px; }
.beh .ic { margin-top: .35em; color: var(--gold); }

/* a question */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 18px; padding: 2px 10px; border-radius: 999px; }
.tag.bad { background: var(--badT); color: var(--bad); }
.tag.blank { background: var(--soft); color: var(--mute); }
.qbox { background: var(--soft); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
.qen { font-size: 22px; color: var(--deep); text-align: left; line-height: 1.6; }
.qar { color: var(--mute); }
.cmp { display: grid; gap: 8px; }
.cmp-r { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); }
.cmp-l { font-weight: 500; }
.cmp-r.mine { color: var(--bad); border-color: #EBB9B1; }
.cmp-r.mine .gl { color: #8C3A31; }
.cmp-r.right { color: var(--teal2); border-color: #9FD8C6; background: var(--tealT); }
.cmp-r.right .gl { color: #0C5F55; }
.why { display: grid; gap: 4px; }
.why h3 { font-size: 19px; color: var(--deep); margin-top: 6px; }
.home { border: 1px solid var(--line2); border-radius: 12px; padding: 0 14px; }
.home summary { cursor: pointer; padding: 12px 0; font-weight: 500; color: var(--deep); display: flex; gap: 8px; align-items: center; list-style: none; }
.home summary::-webkit-details-marker { display: none; }
.home summary::after { content: ''; margin-inline-start: auto; width: 10px; height: 10px; border: solid var(--mute); border-width: 0 2px 2px 0; transform: rotate(45deg); transition: transform .25s var(--ease); }
.home[open] summary::after { transform: rotate(-135deg); }
.home p { padding-bottom: 14px; }
.ref { display: flex; gap: 8px; align-items: flex-start; color: var(--mute); font-size: 18px; }
.ref .ic { margin-top: .3em; }

/* «جرّب نفسك» */
.quiz { display: grid; gap: 14px; padding-top: 18px; border-top: 2px solid var(--line); }
.quiz > h3 { font-size: 24px; color: var(--teal2); }
.quiz-i { color: var(--mute); font-size: 18px; }
.off { background: var(--soft); border-radius: 12px; padding: 12px 14px; color: var(--mute); }
.try { border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px 14px; margin: 0; display: grid; gap: 10px; min-width: 0; }
.try legend { font: 500 18px/1 var(--en); color: var(--paper); background: var(--deep); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.try-q .qen { font-size: 21px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 10px 14px; text-align: left; direction: ltr; border: 2px solid var(--line2); border-radius: 12px; background: var(--paper); cursor: pointer; font-size: 20px; transition: border-color .2s, background-color .2s; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt.wait { border-color: var(--teal); background: var(--soft); }
.opt.wait::after { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line2); border-top-color: var(--teal2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .opt.wait::after { animation: none; border-color: var(--teal2); border-top-color: var(--line2); } }
.opt.right { border-color: var(--teal); background: var(--tealT); color: var(--teal2); }
.opt.wrong { border-color: var(--bad); background: var(--badT); color: var(--bad); }
.opt.dim { opacity: .6; }
.o-t { flex: 1; }
.opt:has(span[dir=rtl]), .opt .o-t:lang(ar) { text-align: right; }
.fb { display: flex; gap: 8px; align-items: center; min-height: 1.75em; color: var(--mute); }
.fb:focus { outline: none; }
.fb.good { color: var(--teal2); }
.fb.miss { color: var(--bad); }

/* final */
.eq { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; padding: 8px 0; }
.eq-c { display: grid; justify-items: center; align-content: center; min-width: 0; height: 100%; padding: 12px 4px; border-radius: 14px; border: 1px solid var(--line2); }
.eq-c b { font: 500 40px/1.1 var(--en); color: var(--deep); }
.eq-c span { font-size: 18px; color: var(--mute); text-align: center; line-height: 1.4; }
.eq-c.imp b { color: var(--teal2); }
.eq-c.new { background: var(--deep); border-color: var(--deep); }
.eq-c.new b, .eq-c.new span { color: #fff; }
.eq-o { font: 500 28px/1 var(--en); color: var(--mute); }
.left { margin: 0; padding-inline-start: 1.2em; }

/* bottom navigation */
.navb { display: flex; flex-wrap: wrap; gap: 10px; }
.navb .next { flex: 1 1 200px; }
.navb .print-btn { flex: 1 1 100%; }
@media (min-width: 560px) { .navb .print-btn { flex: 0 0 auto; margin-inline-start: auto; } }
#print { display: none; }

/* ── v3: the board of questions ── */
.guide { display: flex; gap: 10px; align-items: flex-start; background: var(--soft); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; }
.guide .ic { width: 1.6em; height: 1.6em; color: var(--teal2); margin-top: .1em; }
.guide b { color: var(--deep); }
.guide b.red { color: var(--bad); }
.guide.fin { background: var(--tealT); border-color: var(--teal); }
.guide.fin .ic { fill: currentColor; stroke-width: 1.4; }
.count { color: var(--mute); }
.count b { color: var(--deep); }
.chip.todo > button { background: var(--badT); border: 2px solid var(--bad); color: var(--bad); box-shadow: 0 3px 0 -1px rgba(176, 58, 46, .25); min-height: 64px; }
.chip.todo.s-blank > button { border-style: dashed; }
.chip.done > button { background: var(--tealT); border: 2px solid var(--teal); color: var(--teal2); min-height: 64px; }
.chip.ok:not(:has(button)) { min-height: 64px; opacity: .9; }
.chip > button:active { transform: translateY(1px); }
.chip .ic-star { fill: currentColor; stroke-width: 1.4; }
.scorebox { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.scorebox h3 { font-size: 21px; color: var(--teal2); }
/* the journey: the parent ticks «تم الاطلاع», the student goes question by question */
.handover { border: 2px solid var(--teal); background: var(--tealT); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.handover h3 { font-size: 21px; color: var(--teal2); }
.handover .guide { background: var(--paper); }
label.seen { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; background: var(--paper); border: 2px solid var(--line2); border-radius: 12px; cursor: pointer; font-weight: 500; color: var(--deep); }
label.seen:has(input:checked) { border-color: var(--teal); }
label.seen input { width: 26px; height: 26px; accent-color: var(--teal2); flex: none; margin: 0; }
.to-st { color: var(--deep); font-weight: 500; }
.handover .go { width: 100%; font-size: 1.1em; min-height: 58px; }
.trip { display: grid; gap: 6px; }
.trip p { color: var(--mute); }
.trip b { color: var(--deep); }
.trip .bar { display: block; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.trip .bar i { display: block; height: 100%; background: var(--teal); border-radius: inherit; }
.qview .nextq, .qview .finish { width: 100%; min-height: 58px; font-size: 1.1em; }
.qview .finish .ic, .end-ic .ic { fill: currentColor; stroke-width: 1.4; }
.step.end { text-align: center; justify-items: center; }
.end-ic { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--tealT); color: var(--teal); }
.end-ic .ic { width: 48px; height: 48px; }
.step.end .guide { text-align: start; }
.step.end .btn { width: 100%; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .actions { grid-template-columns: 1fr; } }
.back { justify-self: start; min-height: 48px; padding: 6px 14px; }
.back .ic { transform: none; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .cmp { grid-template-columns: 1fr; } }
.cmp-c { display: grid; gap: 6px; padding: 12px; border-radius: 14px; border: 2px solid var(--line); align-content: start; }
.cmp-l { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.cmp-c.mine { border-color: #EBB9B1; background: #FFF8F7; color: var(--bad); }
.cmp-c.mine .cmp-a .en { text-decoration: line-through; text-decoration-thickness: 2px; }
.cmp-c.right { border-color: var(--teal); background: var(--tealT); color: var(--teal2); }
.cmp-a { font-size: 20px; }
.explain { display: grid; gap: 8px; }
.explain h3 { font-size: 19px; color: var(--deep); }
.btn.soft { justify-content: flex-start; gap: 10px; background: var(--soft); border-color: var(--line2); color: var(--deep); text-align: start; }
.btn.soft[aria-expanded="true"] { border-color: var(--teal); background: var(--tealT); }
.btn.soft .ic { color: var(--teal2); }
.reveal-body { padding: 4px 4px 8px; display: grid; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .reveal-body:not([hidden]) { animation: open .35s var(--ease) both; } @keyframes open { from { opacity: .3; transform: translateY(-4px); } } }
.trycard { border: 2px solid var(--line2); border-radius: 16px; padding: 14px; display: grid; gap: 12px; background: var(--paper); }
.tc-n { display: flex; justify-content: space-between; align-items: center; color: var(--mute); }
.dots { display: inline-flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line2); }
.dot.now { outline: 2px solid var(--deep); outline-offset: 2px; }
.dot.good { background: var(--teal); }
.dot.miss { background: var(--bad); }
.verdict { display: flex; gap: 8px; align-items: center; font-weight: 500; padding: 10px 12px; border-radius: 12px; }
.verdict.good { background: var(--tealT); color: var(--teal2); }
.verdict.miss { background: var(--badT); color: var(--bad); }
.verdict:focus { outline: none; }
@media (prefers-reduced-motion: no-preference) { .verdict { animation: pop .4s var(--ease) both; } @keyframes pop { from { transform: scale(.96); } } }
.nextcard .ic { transform: none; }

/* ── the printed report (also the preview files): black on white, hairline borders ── */
.print { color: #000; font-size: 18px; line-height: 1.5; }
.print table { width: 100%; border-collapse: collapse; margin: 10px 0; }

.p-qs td b { display: block; font-weight: 500; font-size: 18px; }
.p-qs .ic { width: 1.2em; height: 1.2em; }
.p-beh { border: 1.5px solid #000; padding: 6px 10px; margin: 6px 0; }
.p-none { border: 1px solid #000; padding: 10px; }
.p-h { font-size: 22px; margin: 14px 0 6px; border-bottom: 2px solid #000; padding-bottom: 4px; break-after: avoid; }
.pcard { border: 1px solid #000; border-radius: 6px; padding: 8px 12px; margin: 0 0 10px; break-inside: avoid; }
.pcard h3 { font-size: 20px; display: flex; justify-content: space-between; }

.pcard .qen { font-size: 19px; text-align: left; color: #000; }
.pcard .qar { color: #000; }
.pcard dl { margin: 6px 0 0; display: grid; gap: 2px; }

.pcard dt { font-weight: 500; }

.preview .sheet { break-after: page; margin-bottom: 24px; }

@media print {
  @page { size: A4; margin: 13mm 12mm; }
  body { background: #fff; color: #000; font-size: 18px; line-height: 1.5; }

}
